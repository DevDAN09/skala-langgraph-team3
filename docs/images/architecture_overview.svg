<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="'Apple SD Gothic Neo','Noto Sans KR','NanumGothic','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#ffffff"/>

  <!-- 근거 수집 -->
  <rect x="220" y="20" width="740" height="130" rx="12" fill="#f6fbf8" stroke="#1d9e75" stroke-dasharray="6 4"/>
  <text x="240" y="44" font-size="14" font-weight="700" fill="#0f6e56">근거 수집 · Research Agents (Supervisor가 한 번에 1개씩 선택)</text>
  <g font-size="15" text-anchor="middle">
    <rect x="240" y="62" width="220" height="70" rx="8" fill="#e6f5ef" stroke="#1d9e75"/>
    <text x="350" y="92" font-weight="700" fill="#08463a">paper_analysis</text>
    <text x="350" y="115" font-size="13" fill="#0f6e56">Agentic RAG · FAISS</text>
    <rect x="470" y="62" width="220" height="70" rx="8" fill="#e6f5ef" stroke="#1d9e75"/>
    <text x="580" y="92" font-weight="700" fill="#08463a">market_research</text>
    <text x="580" y="115" font-size="13" fill="#0f6e56">Tavily 지지·반대 질의</text>
    <rect x="700" y="62" width="240" height="70" rx="8" fill="#e6f5ef" stroke="#1d9e75"/>
    <text x="820" y="92" font-weight="700" fill="#08463a">stakeholder_research</text>
    <text x="820" y="115" font-size="13" fill="#0f6e56">market 완료 후 실행</text>
  </g>

  <!-- Supervisor -->
  <rect x="240" y="220" width="520" height="110" rx="12" fill="#ece8ff" stroke="#5b4fc4" stroke-width="2.5"/>
  <text x="500" y="250" font-size="18" font-weight="700" text-anchor="middle" fill="#1f1a4d">Supervisor</text>
  <text x="500" y="280" font-size="14" text-anchor="middle" fill="#3c3489">① 수집 직후 근거 검증: R1–R4 규칙 → R5 LLM Judge</text>
  <text x="500" y="306" font-size="14" text-anchor="middle" fill="#3c3489">② 다음 노드 선택: node_status · audit · quality · retry_count</text>

  <!-- START / END -->
  <rect x="40" y="255" width="110" height="40" rx="20" fill="#f1efe8" stroke="#888780"/>
  <text x="95" y="280" font-size="15" font-weight="700" text-anchor="middle" fill="#2c2c2a">START</text>
  <rect x="40" y="470" width="110" height="40" rx="20" fill="#f1efe8" stroke="#888780"/>
  <text x="95" y="495" font-size="15" font-weight="700" text-anchor="middle" fill="#2c2c2a">END</text>

  <!-- 보고서 단계 -->
  <rect x="220" y="410" width="740" height="140" rx="12" fill="#fdf8f5" stroke="#d85a30" stroke-dasharray="6 4"/>
  <text x="240" y="434" font-size="14" font-weight="700" fill="#993c1d">보고서 단계 (근거가 충분하면 Supervisor가 ① → ② → ③ 순서로 선택)</text>
  <g font-size="15" text-anchor="middle">
    <rect x="240" y="452" width="220" height="80" rx="8" fill="#fdf0ea" stroke="#d85a30"/>
    <text x="350" y="484" font-weight="700" fill="#5a2410">① evaluation_synthesis</text>
    <text x="350" y="508" font-size="13" fill="#993c1d">TRL 이원화 · 관점 종합</text>
    <rect x="470" y="452" width="220" height="80" rx="8" fill="#fdf0ea" stroke="#d85a30"/>
    <text x="580" y="484" font-weight="700" fill="#5a2410">② report_generation</text>
    <text x="580" y="508" font-size="13" fill="#993c1d">템플릿 + 근거 문장 번역</text>
    <rect x="700" y="452" width="240" height="80" rx="8" fill="#fdf0ea" stroke="#d85a30"/>
    <text x="820" y="484" font-weight="700" fill="#5a2410">③ quality_eval</text>
    <text x="820" y="508" font-size="13" fill="#993c1d">규칙 → LLM Judge (3안 Hybrid)</text>
  </g>

  <!-- 화살표 -->
  <g stroke="#555" stroke-width="1.8" fill="none">
    <line x1="150" y1="275" x2="236" y2="275" marker-end="url(#a)"/>
    <line x1="560" y1="218" x2="560" y2="154" marker-end="url(#a)"/>
    <line x1="440" y1="152" x2="440" y2="216" marker-end="url(#a)"/>
    <line x1="560" y1="332" x2="560" y2="406" marker-end="url(#a)"/>
    <line x1="440" y1="408" x2="440" y2="334" marker-end="url(#a)"/>
    <path d="M240 318 L95 318 L95 466" marker-end="url(#a)"/>
  </g>
  <g font-size="13" fill="#333">
    <text x="572" y="190">수집 · 재작업 지시</text>
    <text x="428" y="190" text-anchor="end">결과 반환</text>
    <text x="572" y="374">보고서 단계 지시</text>
    <text x="428" y="374" text-anchor="end">결과 반환</text>
    <text x="104" y="360">품질 통과</text>
    <text x="104" y="378">· 평가 2회</text>
    <text x="104" y="396">· 재수집 대상 없음</text>
  </g>
</svg>
